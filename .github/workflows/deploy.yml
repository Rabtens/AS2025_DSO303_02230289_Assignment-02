
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_express: ${{ vars.DB_EXPRESS || 'true' }}
  TF_VAR_db_backup_retention_days: ${{ vars.DB_BACKUP_RETENTION_DAYS || '1' }}
  TF_VAR_db_max_acu: ${{ vars.DB_MAX_ACU || '4' }}
  TF_VAR_ses_sender: ${{ vars.SES_SENDER }}
  TF_VAR_tutor_email: ${{ vars.TUTOR_EMAIL }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 4. Validate required GitHub variables
      - name: Validate deployment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          validation_failed=0

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z0-9]+)*:iam::[0-9]{12}:role/[^[:space:]\<\>]+$ ]]; then
            echo "::error::Set the GitHub Actions variable AWS_ROLE_ARN to the deploy_role_arn output from terraform -chdir=bootstrap output -raw deploy_role_arn."
            validation_failed=1
          fi

          if [[ ! "$TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::Set the GitHub Actions variable TF_STATE_BUCKET to the state_bucket output from terraform -chdir=bootstrap output -raw state_bucket."
            validation_failed=1
          fi

          if (( validation_failed )); then
            exit 1
          fi
          echo "Deployment variables validated."

      # 5. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # 6. Static checks
      - name: Static checks
        run: |
          python -m py_compile backend/*.py

      # 7. Build Lambda package
      - name: Build Lambda package
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      # 8. Initialize Terraform
      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=exam-platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      # 9. Terraform formatting and validation
      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra validate

      # 10. Terraform plan
      - name: Terraform plan
        run: terraform -chdir=infra plan -out=tfplan -input=false

      # 11. Apply changes only when pushing to main
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! terraform -chdir=infra show -json tfplan | jq -e '
            all(.resource_changes[]?; .type != "aws_rds_cluster" and .type != "aws_cloudformation_stack" or
              (.change.actions | index("delete") | not))
          ' >/dev/null; then
            echo "::error::The plan could delete a database. Migrate the data before switching deployment modes."
            exit 1
          fi

          terraform -chdir=infra apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Verify database Availability Zones
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CLUSTER=$(terraform -chdir=infra output -raw db_cluster_id)
          MEMBERS=$(aws rds describe-db-clusters --db-cluster-identifier "$CLUSTER" --query 'DBClusters[0].DBClusterMembers' --output json)
          echo "$MEMBERS" | jq -r '.[] | [.DBInstanceIdentifier, (if .IsClusterWriter then "writer" else "reader" end)] | @tsv'
          INSTANCES=$(aws rds describe-db-instances --filters "Name=db-cluster-id,Values=$CLUSTER" --query 'DBInstances[].{Instance:DBInstanceIdentifier,Zone:AvailabilityZone,Status:DBInstanceStatus}' --output json)
          echo "$INSTANCES" | jq -r '.[] | [.Instance, .Zone, .Status] | @tsv'
          jq -e '[.[] | select(.Status == "available") | .Zone] | unique | length >= 2' <<< "$INSTANCES" >/dev/null

      # 12. Invalidate CloudFront cache and smoke test
      - name: Invalidate CDN and smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          DIST=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          URL=$(terraform -chdir=infra output -raw site_url)

          aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths "/*" >/dev/null

          curl -fsS --retry 5 --retry-delay 10 "$URL/" >/dev/null
          curl -fsS --retry 5 --retry-delay 10 "$URL/api/health"
