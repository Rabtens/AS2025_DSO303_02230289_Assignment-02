<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>University Exam Platform</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#222}
fieldset,section{border:1px solid #ccc;border-radius:6px;margin:1rem 0;padding:1rem}
button{padding:.4rem .9rem;margin:.2rem}.muted{color:#666;font-size:.9rem}textarea{width:100%}
</style></head><body>
<h1>Exam Platform</h1><div id="status" class="muted"></div>
<section id="login"><h3>Sign in</h3>
<input id="u" placeholder="email"> <input id="p" type="password" placeholder="password"> <button id="loginBtn">Sign in</button></section>
<div id="app" hidden>
 <p>Signed in as <b id="who"></b> (<span id="role"></span>)</p>
 <section><h3>Exams</h3><div id="exams"></div></section>
 <section id="examView" hidden><h3 id="examTitle"></h3><div id="qs"></div>
  <button id="submitBtn">Submit exam</button> <span id="saved" class="muted"></span></section>
 <section><h3>Upload assignment (PDF or ZIP, max 50 MB)</h3>
  <input type="file" id="file" accept=".pdf,.zip"> <button id="uploadBtn">Upload</button> <span id="upmsg" class="muted"></span></section>
 <section id="tutor" hidden><h3>Tutor: create exam</h3>
  <input id="tt" placeholder="title"> <input id="td" type="number" value="60" style="width:5em"> min
  <textarea id="tq" rows="6">[{"id":"q1","type":"mcq","text":"2+2?","options":["3","4"],"answer":1,"points":1},{"id":"q2","type":"short","text":"Define RPO"}]</textarea>
  <button id="createBtn">Create</button></section>
</div>
<script>
let cfg, idToken, claims, current, answers = {}, timer;
const $ = id => document.getElementById(id);
const say = t => $('status').textContent = t;
const isTutor = () => /tutor|admin/.test(String(claims['cognito:groups'] || ''));

async function api(method, path, body) {
  const r = await fetch('/api' + path, {method, headers: {'content-type': 'application/json', authorization: idToken},
    body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
async function login() {
  const r = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {method: 'POST',
    headers: {'content-type': 'application/x-amz-json-1.1', 'x-amz-target': 'AWSCognitoIdentityProviderService.InitiateAuth'},
    body: JSON.stringify({AuthFlow: 'USER_PASSWORD_AUTH', ClientId: cfg.clientId, AuthParameters: {USERNAME: $('u').value, PASSWORD: $('p').value}})});
  const j = await r.json(); if (!j.AuthenticationResult) return say(j.message || 'login failed');
  idToken = j.AuthenticationResult.IdToken;
  claims = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  $('who').textContent = claims.email; $('role').textContent = String(claims['cognito:groups'] || 'no group');
  $('tutor').hidden = !isTutor(); $('login').hidden = true; $('app').hidden = false; say(''); listExams();
}
async function listExams() {
  const box = $('exams'); box.textContent = '';
  for (const e of await api('GET', '/exams')) {
    const b = document.createElement('button'); b.textContent = `${e.title} (${e.duration_min} min)`; b.onclick = () => openExam(e.id); box.append(b);
    if (isTutor()) {
      const r = document.createElement('button'); r.textContent = 'Release results';
      r.onclick = async () => say((await api('POST', `/exams/${e.id}/release`)).status); box.append(r);
    }
  }
}
async function openExam(id) {
  const exam = await api('GET', '/exams/' + id), att = await api('POST', `/exams/${id}/start`);
  current = id; answers = att.answers; $('examTitle').textContent = exam.title; $('examView').hidden = false;
  const qs = $('qs'); qs.textContent = '';
  for (const q of exam.questions) {
    const f = document.createElement('fieldset'), l = document.createElement('legend'); l.textContent = q.text; f.append(l);
    if (q.type === 'mcq') q.options.forEach((o, i) => {
      const lab = document.createElement('label'), r = document.createElement('input');
      r.type = 'radio'; r.name = q.id; r.checked = answers[q.id] === i; r.onchange = () => answers[q.id] = i;
      lab.append(r, ' ' + o, document.createElement('br')); f.append(lab);
    });
    else { const t = document.createElement('textarea'); t.value = answers[q.id] || ''; t.oninput = () => answers[q.id] = t.value; f.append(t); }
    qs.append(f);
  }
  clearInterval(timer); timer = setInterval(autosave, 30000);   // autosave every 30 s
}
async function autosave() {
  try { const r = await api('PUT', `/exams/${current}/answers`, {answers}); $('saved').textContent = 'Saved ' + new Date(r.saved_at).toLocaleTimeString(); }
  catch (e) { $('saved').textContent = 'Save failed, retrying in 30 s (' + e.message + ')'; }  // answers stay in memory
}
async function submitExam() { clearInterval(timer); await autosave(); say((await api('POST', `/exams/${current}/submit`)).status); }
async function upload() {
  const f = $('file').files[0]; if (!f) return;
  const p = await api('POST', '/uploads/presign', {filename: f.name, size_bytes: f.size});
  const fd = new FormData(); Object.entries(p.fields).forEach(([k, v]) => fd.append(k, v)); fd.append('file', f);  // file must be last
  $('upmsg').textContent = 'Uploading directly to S3...';
  const r = await fetch(p.url, {method: 'POST', body: fd});
  $('upmsg').textContent = r.ok ? 'Uploaded. Your tutor has been notified.' : 'Upload failed (' + r.status + ')';
}
async function createExam() {
  const r = await api('POST', '/exams', {title: $('tt').value, duration_min: +$('td').value, questions: JSON.parse($('tq').value)});
  say('Created exam ' + r.id); listExams();
}
$('loginBtn').onclick = () => login().catch(e => say(e.message));
$('submitBtn').onclick = () => submitExam().catch(e => say(e.message));
$('uploadBtn').onclick = () => upload().catch(e => say(e.message));
$('createBtn').onclick = () => createExam().catch(e => say(e.message));
fetch('/config.json').then(r => r.json()).then(c => cfg = c);
</script></body></html>
